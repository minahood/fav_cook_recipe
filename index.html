<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>favoレシピ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>
        <svg class="title-icon" viewBox="0 0 54 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- フォーク -->
          <line x1="7" y1="20" x2="7" y2="42"/>
          <line x1="5" y1="6" x2="5" y2="17"/>
          <line x1="7" y1="6" x2="7" y2="17"/>
          <line x1="9" y1="6" x2="9" y2="17"/>
          <path d="M5 17Q7 21 9 17"/>
          <!-- 皿 -->
          <circle cx="27" cy="27" r="10"/>
          <circle cx="27" cy="27" r="6.5"/>
          <!-- ナイフ -->
          <line x1="47" y1="22" x2="47" y2="42"/>
          <path d="M47 6L51 15Q51 20 47 22"/>
          <line x1="47" y1="6" x2="47" y2="22"/>
        </svg>
        favoレシピ
      </h1>
      <p class="subtitle">大切なレシピリンクを保存しよう</p>
    </div>
  </header>

  <main>
    <section class="categories-section">
      <h2 class="section-title">カテゴリ</h2>
      <div class="category-grid" id="categoryGrid"></div>
    </section>

    <section class="recipe-section" id="recipeSection" style="display:none;">
      <div class="recipe-header">
        <button class="back-btn" id="backBtn">← カテゴリに戻る</button>
        <h2 class="recipe-title" id="recipeTitle"></h2>
      </div>

      <div class="add-form">
        <h3>レシピを追加</h3>
        <div class="form-row">
          <input type="text" id="recipeNameInput" placeholder="レシピ名（例：肉じゃが）" />
          <input type="url" id="recipeLinkInput" placeholder="URL（例：https://...）" />
          <button class="add-btn" id="addBtn">追加</button>
        </div>
        <p class="form-error" id="formError"></p>
      </div>

      <div class="recipe-list" id="recipeList"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
