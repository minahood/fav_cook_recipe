<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>favoレシピ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>
        <svg class="title-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- fork -->
          <line x1="8" y1="20" x2="8" y2="42"/>
          <line x1="6" y1="6" x2="6" y2="17"/>
          <line x1="8" y1="6" x2="8" y2="17"/>
          <line x1="10" y1="6" x2="10" y2="17"/>
          <path d="M6 17Q8 21 10 17"/>
          <!-- plate -->
          <circle cx="24" cy="26" r="12"/>
          <circle cx="24" cy="26" r="8"/>
          <!-- knife -->
          <line x1="40" y1="22" x2="40" y2="42"/>
          <path d="M40 6L44 15Q44 20 40 22"/>
          <line x1="40" y1="6" x2="40" y2="22"/>
        </svg>
        favoレシピ
      </h1>
      <p class="subtitle">大切なレシピリンクを保存しよう</p>
    </div>
  </header>

  <main>
    <section class="categories-section">
      <h2 class="section-title">カテゴリ</h2>
      <div class="category-grid" id="categoryGrid"></div>
    </section>

    <section class="recipe-section" id="recipeSection" style="display:none;">
      <div class="recipe-header">
        <button class="back-btn" id="backBtn">← カテゴリに戻る</button>
        <h2 class="recipe-title" id="recipeTitle"></h2>
      </div>

      <div class="add-form">
        <h3>レシピを追加</h3>
        <div class="form-row">
          <input type="text" id="recipeNameInput" placeholder="レシピ名（例：肉じゃが）" />
          <input type="url" id="recipeLinkInput" placeholder="URL（例：https://...）" />
          <button class="add-btn" id="addBtn">追加</button>
        </div>
        <p class="form-error" id="formError"></p>
      </div>

      <div class="recipe-list" id="recipeList"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
